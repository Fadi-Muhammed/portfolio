name: CI

on:
  # Pushes land on main (see CLAUDE.md git discipline); branches are covered by
  # pull_request. Filtering push to main stops a same-repo PR running CI twice on
  # the same commit.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Dummy public value: the build only needs this to be a valid URL. Nothing
      # secret is ever needed to build, and nothing secret belongs in this file.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # The e2e suite covers /design, which is flag-gated and inlined at build time.
      # Production leaves this unset, so the route is absent there.
      NEXT_PUBLIC_ENABLE_DESIGN_ROUTE: "true"
      # Cloudflare's published always-pass Turnstile keys. Not secrets — they are in the
      # public documentation, and they exist so a test environment does not need real
      # ones. A Vercel preview runs on *.vercel.app, which cannot be added to a widget's
      # hostname list, so these are the only workable answer there too.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
